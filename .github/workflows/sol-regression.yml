name: sol-regression
# Pushes to main, plus every pull request. Branch pushes with an open PR used to run everything twice.
on:
  push:
    branches: [main]
  pull_request:
# The repo is public: the token only reads. Actions are pinned by commit, Python packages by hash.
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r .github/requirements-gate.txt
      - name: Regression suite (planner drift, provenance, n-body gate)
        run: python day3/run_regression.py
      - name: Self-test, a planted made-up number must turn the suite red
        run: "! python day3/run_regression.py --plant 2"
  connector:
    runs-on: ${{ matrix.os }}
    # sim-policy.test.mjs alone takes about 6 min on 4 Linux cores and 10 to 18 min on the 2-core Windows runner.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: connector
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Connector unit and local MCP integration tests
        run: npm test
