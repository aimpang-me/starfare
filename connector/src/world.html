<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfare Company</title>
<meta name="description" content="Run a simulated Starseeker company with your own agents: one executor and two dispatchers, each its own Grok chat.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/message-b.css">
<style>
/* Mission Control tokens (docs/DESIGN.md; design/assets/mission-control.css). Flat surfaces, Inter only. */
@font-face{font-family:Inter;src:url('/assets/InterVariable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
:root{color-scheme:dark;--bg:#06090d;--bg-2:#0b1016;--line:#26323e;--line-2:#465565;--ink:#edf1f5;--ink-2:#aab6c3;--ink-3:#96a4b3;--cy:#9cc3df;--me:#e7c48c;--ok:#8fd19e;--bad:#f0a196;--r:4px;
  --d1:#9cc3df;--d2:#e7c48c;--gut:max(16px,env(safe-area-inset-left,0px))}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
p{margin:0}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #d6e7f4;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--ink-2)}.faint{color:var(--ink-3)}
.caps{font-size:11px;letter-spacing:.07em;color:var(--ink-3)}
.tag{display:inline-flex;align-items:center;border:1px solid #3a4755;border-radius:3px;padding:0 6px;font:500 9px/16px Inter,sans-serif;color:#b2bfcc;white-space:nowrap}
.chip{display:inline-flex;align-items:center;border:1px solid;border-radius:2px;padding:0 6px;font:500 10px/16px Inter,sans-serif;white-space:nowrap}
.chip.off{color:var(--ink-2);border-color:var(--line-2)}
.chip.work{color:var(--cy);border-color:#3d5568}
.chip.wait{color:var(--ok);border-color:#3f5b47}
.chip.warn{color:var(--bad);border-color:#6e4740}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r);background:transparent;color:var(--ink);font:500 13px Inter,sans-serif;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:#1b2732;border-color:#657b8e}
.btn.primary{background:#17222d;border-color:#526576}
.btn.primary:hover{background:#243443;color:#fff}
.btn.small{min-height:36px;font-size:12px;padding:0 10px}
.btn:disabled{opacity:.45;cursor:default}
.top{display:flex;align-items:center;gap:20px;height:60px;padding:0 max(24px,var(--gut));background:#080d12;border-bottom:1px solid var(--line)}
.brand{font:650 16px/1 Inter,sans-serif;letter-spacing:.2em;color:var(--ink);text-decoration:none}
.top .sub{padding-left:20px;border-left:1px solid var(--line);font:500 12px Inter,sans-serif;color:var(--ink-2)}
.top .r{margin-left:auto;display:flex;gap:8px;align-items:center}
main{max-width:1280px;margin:0 auto;padding:20px max(24px,var(--gut)) 40px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h2{font:600 13px/1.3 Inter,sans-serif}
.ph .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.pb{padding:12px 14px}
.clock{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;padding:14px}
.clock b{font:600 21px/1.2 Inter,sans-serif;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media (max-width:1000px){.grid,.two{grid-template-columns:1fr}}
.seat{display:flex;flex-direction:column;gap:8px}
.seat h3{font:600 13px Inter,sans-serif;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.code{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:#080d13;border:1px solid var(--line);border-radius:3px;padding:8px 10px;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.D1{background:var(--d1)}.dot.D2{background:var(--d2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:500 11px Inter,sans-serif;letter-spacing:.04em;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #161e27;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;align-items:baseline}
.score .k{color:var(--ink-2)}
.score .v{font:600 15px Inter,sans-serif;font-variant-numeric:tabular-nums;text-align:right}
.score .rv{color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{min-height:40px;padding:0 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);font:500 12px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);background:#1b2937;border-bottom-color:var(--cy)}
.comms{max-height:460px;overflow-y:auto}
.empty{padding:14px;color:var(--ink-2)}
.start{max-width:720px;display:flex;flex-direction:column;gap:14px;padding:24px 0}
.start h1{font:600 26px/1.2 Inter,sans-serif;letter-spacing:-.02em}
.start ol{margin:0;padding-left:20px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.map{position:relative;height:460px}
.map canvas{display:block;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
@media (max-width:560px){.map{height:340px}}
.err{color:var(--bad)}
.foot{color:var(--ink-3);font-size:12px}
@media (max-width:560px){.top{padding:0 16px;gap:12px}.top .sub{display:none}main{padding:16px 16px 32px}.clock b{font-size:18px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">STARFARE</a>
  <span class="sub">Your company</span>
  <span class="tag">Simulated</span>
  <div class="r"><a class="btn small" href="/">Mission control</a></div>
</header>
<main id="app"><p class="dim">Loading…</p></main>
<script>
"use strict";
const WORLD = __WORLD__;
const SEATS = ["EX", "D1", "D2"];
const DESK = { D1: "Inner desk", D2: "Outer desk" };
const app = document.getElementById("app");

// Elements by hand, text always as text: agent names, reports and messages come from agents.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
}
const store = {
  get(id) { try { return JSON.parse(localStorage.getItem("sf-world:" + id) || "null"); } catch { return null; } },
  set(id, codes) { try { localStorage.setItem("sf-world:" + id, JSON.stringify(codes)); } catch {} },
};
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); const was = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = was; }, 1400); }
  catch { prompt("Copy this:", text); }
}
const fmt = (n) => (n == null ? "–" : Math.round(n).toLocaleString("en-US"));
const pct = (x) => (x == null ? "–" : (x * 100).toFixed(1) + "%");

function brief(seat, code) {
  const common = "Using the Starfare connector, call join with code " + code + ", and pass that same code on every Starfare call. ";
  const loop = "Whenever you have nothing to do, call wait and act on what it returns. Keep going until I say stop. Every number you tell me must come from a tool result.";
  if (seat === "EX") return "You are the executor (EX) of my simulated Starfare company. " + common +
    "Run the company: read company and market, give bookings to the Inner desk (D1) or the Outer desk (D2) with assign, decline the rest, move ships between desks with transfer_ship, read reports, and message the dispatchers. " + loop;
  return "You are dispatcher " + seat + " (" + DESK[seat] + ") of my simulated Starfare company. " + common +
    "Read your queue and fly each job with get_hail, plan_pickup, plan_ride, check_pad, space_weather, dispatch and decide, passing your code and the job_id. Use only your desk's ships. Tell the executor how it went with report. " + loop;
}

// ---- no world yet: start one ----
function startPage(error) {
  app.replaceChildren(h("section", { class: "start" },
    h("h1", {}, "Run a Starseeker company with your agents"),
    h("p", { class: "dim" }, "You get a private copy of the solar system: its own sky clock, weather and market of bookings, and today's 11 ships split between two desks. Everything in it is simulated."),
    h("ol", {},
      h("li", {}, "Start a company. This page shows three seat codes: the executor (EX) and two dispatchers (D1, D2)."),
      h("li", {}, "Open three Grok chats with the Starfare connector on, and paste one seat's message into each."),
      h("li", {}, "The executor gives bookings to the desks; each dispatcher flies its desk's ships. The sky clock moves a day once every joined seat is waiting.")),
    h("div", { class: "row" }, h("button", { class: "btn primary", onclick: make }, "Start a company")),
    error ? h("p", { class: "err" }, error) : null,
    h("p", { class: "foot" }, "Keep this company's link: it is the key to your world. Works with Grok.")));
}
async function make(ev) {
  ev.target.disabled = true;
  try {
    const r = await fetch("/world/new", { method: "POST" }), v = await r.json();
    if (!r.ok) throw new Error(v.error || "status " + r.status);
    store.set(v.world_id, v.codes);
    location.href = "/world/" + v.world_id;
  } catch (e) { startPage("Couldn't start a company: " + e.message); }
}

// ---- a world ----
let view = null, codes = WORLD ? store.get(WORLD) : null, tab = "all", failed = 0;
async function load() {
  try {
    const r = await fetch("/world/" + WORLD + ".json", { cache: "no-store" });
    if (r.status === 404) { app.replaceChildren(h("p", { class: "err" }, "There is no company at this link. It may have been deleted after 30 days without use."), h("p", {}, h("a", { class: "btn", href: "/world" }, "Start a new company"))); return false; }
    if (!r.ok) throw new Error("status " + r.status);
    view = await r.json(); failed = 0;
    render();
  } catch (e) { if (++failed >= 3) document.getElementById("live")?.replaceChildren("Can't reach the server; retrying…"); }
  return true;
}
async function newCodes(ev) {
  if (!confirm("New codes for all three seats? The old codes stop working, so each agent has to join again with its new code.")) return;
  ev.target.disabled = true;
  try {
    const r = await fetch("/world/" + WORLD + "/codes", { method: "POST" }), v = await r.json();
    if (!r.ok) throw new Error(v.error || "status " + r.status);
    codes = v.codes; store.set(WORLD, codes); view = v; render();
  } catch (e) { alert("Couldn't issue new codes: " + e.message); ev.target.disabled = false; }
}

function clockPanel(v) {
  const c = v.clock, joined = v.seats.filter((s) => s.joined).length;
  const next = c.done ? "The clock has reached the end of its span." : !joined ? "The clock waits until a seat joins."
    : "Next tick when every joined seat is waiting" + (c.cap_tick_in_s != null ? ", or in " + c.cap_tick_in_s + " s" : "") + ".";
  return h("section", { class: "panel clock", "aria-label": "Sky clock" },
    h("div", {}, h("div", { class: "caps" }, "Sky time"), h("b", { class: "num" }, c.sky_now)),
    h("div", {}, h("div", { class: "caps" }, "Tick"), h("b", { class: "num" }, c.tick)),
    h("div", { class: "dim", style: "flex:1 1 260px" }, next, " One tick is ", c.tick_days, " sky day. ", h("span", { class: "tag" }, "Simulated")),
    h("div", { class: "faint", id: "live" }, ""));
}

function seatCard(v, s) {
  const code = codes && codes[s.seat], role = s.seat === "EX" ? "Executor (EX)" : "Dispatcher " + s.seat;
  const state = !s.joined ? h("span", { class: "chip off" }, "Not joined") : s.waiting ? h("span", { class: "chip wait" }, "Waiting") : h("span", { class: "chip work" }, "Working");
  const a = s.agent, who = a && [a.name, a.model, a.thinking && "thinking " + a.thinking].filter(Boolean).join(" · ");
  return h("div", { class: "panel pb seat" },
    h("h3", {}, s.desk ? h("span", { class: "dot " + s.seat, "aria-hidden": "true" }) : null, role, s.desk ? h("span", { class: "dim" }, s.desk) : null, state),
    who ? h("p", { class: "dim" }, who, " ", h("span", { class: "tag" }, "Self-reported")) : null,
    s.stalls ? h("p", { class: "faint" }, "Kept the clock waiting past its cap ", s.stalls, s.stalls === 1 ? " time" : " times") : null,
    code ? [h("div", { class: "code" }, code),
      h("div", { class: "row" },
        h("button", { class: "btn small primary", onclick: (e) => copy(brief(s.seat, code), e.target) }, "Copy message for its chat"),
        h("button", { class: "btn small", onclick: (e) => copy(code, e.target) }, "Copy code"))]
      : h("p", { class: "faint" }, "This browser doesn't have this seat's code. Each code is shown once; New codes makes a fresh set."));
}

function scoresPanel(v) {
  const s = v.scores, ref = s.reference, rows = [];
  const line = (k, mine, theirs) => rows.push(h("span", { class: "k" }, k), h("span", { class: "v" }, mine), h("span", { class: "rv" }, theirs));
  rows.push(h("span", {}), h("span", { class: "caps", style: "text-align:right" }, "Yours"), h("span", { class: "caps", style: "text-align:right" }, "Reference"));
  line("Company score", fmt(s.company.score), ref ? fmt(ref.company.score) : "–");
  line("Person-trips flown", s.company.served_person_trips + " of " + s.company.offered_person_trips, ref ? String(ref.company.served_person_trips) : "–");
  line("Mean flight score", fmt(s.company.mean), ref ? fmt(ref.company.mean) : "–");
  for (const d of s.desks) {
    const r = ref && ref.desks.find((x) => x.desk === d.desk);
    line(d.name + " mean (" + d.ended + " ended, " + d.open + " open)", fmt(d.mean), r ? fmt(r.mean) : "–");
  }
  return h("section", { class: "panel" },
    h("div", { class: "ph" }, h("h2", {}, "Scores"), h("div", { class: "r" }, h("span", { class: "tag" }, "Points only · Simulated"))),
    h("div", { class: "pb" }, h("div", { class: "score" }, rows),
      h("p", { class: "faint", style: "margin-top:10px;font-size:12px" },
        "A desk's mean counts an abandoned job as 0. The company score is the share of person-trips flown times the mean. ",
        ref ? "The reference is a greedy executor with naive dispatchers on this world's market and weather, at tick " + ref.tick + "." : "The reference company hasn't reported yet.")));
}

function desksPanel(v) {
  return h("section", { class: "panel" },
    h("div", { class: "ph" }, h("h2", {}, "Desks and ships"), h("div", { class: "r" }, h("span", { class: "tag" }, "Fictional ships"))),
    h("div", { class: "scroll" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "Ship"), h("th", {}, "Desk"), h("th", {}, "Parked at"), h("th", {}, "Free"))),
      h("tbody", {}, v.desks.flatMap((d) => d.ships.map((sh) => h("tr", {},
        h("td", {}, sh.name, h("div", { class: "faint", style: "font-size:12px" }, sh.ship_class, " · ", sh.seats, " seats")),
        h("td", {}, h("span", { class: "dot " + d.desk, "aria-hidden": "true" }), " ", d.name),
        h("td", {}, sh.at.name),
        h("td", { class: "num" }, sh.free === "free" ? "Free" : sh.free, sh.job ? h("div", { class: "faint" }, "Flying ", sh.job) : null))))))));
}

function jobsPanel(v) {
  const jobs = [...v.jobs].reverse();
  return h("section", { class: "panel" },
    h("div", { class: "ph" }, h("h2", {}, "Jobs"), h("div", { class: "r" }, h("span", { class: "faint" }, v.market.open + " of " + v.market.size + " bookings on the market"))),
    jobs.length ? h("div", { class: "scroll" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "Job"), h("th", {}, "Booking"), h("th", {}, "Desk"), h("th", {}, "Status"), h("th", { class: "n" }, "Score"))),
      h("tbody", {}, jobs.map((j) => h("tr", {},
        h("td", { class: "num" }, j.job_id),
        h("td", {}, j.title, j.ship ? h("div", { class: "faint", style: "font-size:12px" }, j.ship, j.lands ? (j.landed ? " · landed " : " · lands ") + j.lands : "") : null),
        h("td", {}, j.desk ? [h("span", { class: "dot " + j.desk, "aria-hidden": "true" }), " ", j.desk] : "–"),
        h("td", {}, status(j)),
        h("td", { class: "n" }, j.total != null ? fmt(j.total) : j.phase === "abandoned" ? "0" : "–"))))))
      : h("p", { class: "empty" }, "No jobs yet. The executor takes bookings from the market with assign."));
}
function status(j) {
  if (j.phase === "planning") return h("span", { class: "chip work" }, "Planning");
  if (j.phase === "in_flight") return h("span", { class: "chip warn" }, "At a checkpoint");
  if (j.phase === "arrived") return h("span", { class: "chip wait" }, j.landed ? "Landed" : "Flying");
  return h("span", { class: "chip off" }, "Abandoned" + (j.reason ? " (" + j.reason + ")" : ""));
}

// Comms: one channel per seat. A message shows in its sender's and each recipient's channel, a report in its dispatcher's and
// the executor's, ticks in every channel.
function commsRows(v) {
  const rows = [];
  for (const m of v.messages || []) rows.push({ at: m.at_ms, tick: m.tick, kind: "message", cls: "plan", seats: [m.from, ...m.to], who: m.from + " to " + (m.to.length > 1 ? "all" : m.to[0]), text: m.text });
  for (const r of v.reports || []) rows.push({ at: r.at_ms, tick: r.tick, kind: "report", cls: "dispatch", seats: [r.seat, "EX"], who: r.seat + " to EX" + (r.job_id ? " · " + r.job_id : ""), text: r.text });
  for (const e of v.events || []) rows.push({ at: e.at_ms, tick: e.tick, kind: "tick", cls: "neutral", seats: SEATS, who: "Sky clock", text: "Tick " + e.tick + ": " + e.sky + (e.stalled && e.stalled.length ? ". Ran without " + e.stalled.join(", ") + " (cap)." : ".") });
  return rows.filter((r) => tab === "all" || r.seats.includes(tab)).sort((a, b) => b.at - a.at);
}
function commsPanel(v) {
  const rows = commsRows(v), tabs = [["all", "All"], ...SEATS.map((s) => [s, s === "EX" ? "Executor" : s + " · " + DESK[s]])];
  return h("section", { class: "panel" },
    h("div", { class: "ph" }, h("h2", {}, "Comms"), h("div", { class: "r" }, h("span", { class: "tag" }, "Agents' own words"))),
    h("div", { class: "tabs", role: "tablist" }, tabs.map(([k, label]) => h("button", { role: "tab", "aria-selected": String(tab === k), onclick: () => { tab = k; render(); } }, label))),
    rows.length ? h("ul", { class: "mb-list comms" }, rows.map((r) => h("li", { class: "mb" },
      h("span", { class: "mb-t" }, "T" + r.tick),
      h("span", { class: "mb-c " + r.cls }, r.kind),
      h("span", { class: "mb-x" }, h("span", { class: "mb-a" }, r.who), h("span", { class: "mb-s" }, r.text)))))
      : h("p", { class: "empty" }, "Nothing yet. Messages between seats, dispatchers' reports and clock ticks show here."));
}

// ---- the map: the world's places at its sky time, and the fleet coloured by desk ----
// Distances from the Sun are on a log scale so Mercury and Neptune both fit; moons and stations are spread around their
// planet, not drawn to scale. A ship in flight is drawn on a straight line between the stops of its leg, by sky time.
const jdOf = (iso) => Date.parse(iso.replace(" ", "T") + ":00Z") / 864e5 + 2440587.5;
const COL = { D1: "#9cc3df", D2: "#e7c48c" };
function mapPanel(v) {
  const box = h("div", { class: "map" }), canvas = h("canvas", { role: "img", "aria-label": "Map of the solar system at " + v.clock.sky_now + " with your ships coloured by desk. The Desks and ships table lists the same ships." });
  box.append(canvas);
  requestAnimationFrame(() => drawMap(canvas, v));
  return h("section", { class: "panel" },
    h("div", { class: "ph" }, h("h2", {}, "Map"), h("div", { class: "r" }, h("span", { class: "faint num" }, v.map.sky), h("span", { class: "tag" }, "Simulated"))),
    box,
    h("div", { class: "legend" },
      h("span", {}, h("span", { class: "dot D1", "aria-hidden": "true" }), " Inner desk"),
      h("span", {}, h("span", { class: "dot D2", "aria-hidden": "true" }), " Outer desk"),
      h("span", {}, "A ring: held at a checkpoint."),
      h("span", { class: "faint" }, "Distance from the Sun on a log scale; moons and stations spread around their planet; ships in flight drawn on a straight line between stops (illustrative).")));
}
function drawMap(canvas, v) {
  const W = canvas.clientWidth, H = canvas.clientHeight, dpr = window.devicePixelRatio || 1;
  if (!W || !H) return;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const P = Object.fromEntries(v.map.places.map((p) => [p.id, p])), kids = {};
  for (const p of v.map.places) if (p.parent !== "sun") (kids[p.parent] ||= []).push(p.id);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - 22, K = 0.3;
  // The map reaches Saturn (Titan Dock is the farthest berth); Uranus and Neptune show only when a flight goes there.
  const dist = (p) => Math.hypot(p.xy[0], p.xy[1]), far = new Set(), served = new Set();
  for (const d of v.desks) for (const sh of d.ships) served.add(sh.at.id);
  for (const j of v.jobs) for (const L of j.legs || []) { served.add(L.from); served.add(L.to); }
  const top = (id) => (P[id] && P[id].parent !== "sun" ? top(P[id].parent) : id);
  const rmax = Math.max(...v.map.places.filter((p) => p.xy && (p.kind !== "planet" || ["mercury", "venus", "earth", "mars", "jupiter", "saturn"].includes(p.id) || [...served].some((id) => top(id) === p.id))).map(dist));
  for (const p of v.map.places) if (p.xy && dist(p) > rmax * 1.001) far.add(p.id);
  const rad = (r) => (R * Math.log(1 + r / K)) / Math.log(1 + rmax / K);
  const pt = {};
  // Top of the map is +y of the ecliptic frame; screen y runs down.
  for (const p of v.map.places) if (p.xy && !far.has(p.id)) {
    const r = Math.hypot(p.xy[0], p.xy[1]), s = rad(r) / (r || 1);
    pt[p.id] = [cx + p.xy[0] * s, cy - p.xy[1] * s];
  }
  const place = (id) => {
    if (pt[id]) return pt[id];
    const p = P[id]; if (!p) return [cx, cy];
    const at = place(p.parent), sib = kids[p.parent], i = sib.indexOf(id), ring = P[p.parent].parent === "sun" ? 24 : 11;
    const a = -Math.PI / 2 + (2 * Math.PI * i) / sib.length;
    return (pt[id] = [at[0] + ring * Math.cos(a), at[1] + ring * Math.sin(a)]);
  };
  // Orbits (circles at each body's distance now), the Sun, the planets.
  g.lineWidth = 1;
  for (const p of v.map.places) if (p.xy && !far.has(p.id)) {
    g.strokeStyle = p.kind === "planet" ? "#1c2731" : "#151e27";
    g.beginPath(); g.arc(cx, cy, rad(Math.hypot(p.xy[0], p.xy[1])), 0, 2 * Math.PI); g.stroke();
  }
  g.fillStyle = "#f3d9a4"; g.beginPath(); g.arc(cx, cy, 4, 0, 2 * Math.PI); g.fill();
  // Ships: where each one is at the world's sky time, and the rest of the route of one in flight.
  const now = jdOf(v.clock.sky_now), jobs = Object.fromEntries(v.jobs.map((j) => [j.job_id, j])), stack = {}, used = new Set(), ships = [];
  for (const d of v.desks) for (const sh of d.ships) {
    const j = sh.job && jobs[sh.job];
    let xy = null, route = null;
    if (j && j.held_at) { xy = place(j.held_at); used.add(j.held_at); }
    else if (j && j.legs && j.legs.length) {
      const legs = j.legs.map((L) => [L.from, L.to, jdOf(L.depart), jdOf(L.arrive)]), k = legs.findIndex((L) => now < L[3]);
      if (k >= 0) {
        const [from, to, dep, arr] = legs[k], f = now <= dep ? 0 : Math.min(1, (now - dep) / Math.max(arr - dep, 1e-9)), a = place(from), b = place(to);
        xy = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
        route = [xy, ...legs.slice(k).map((L) => place(L[1]))];
        legs.slice(k).forEach((L) => { used.add(L[0]); used.add(L[1]); });
      }
    }
    if (!xy) { const n = (stack[sh.at.id] = (stack[sh.at.id] || 0) + 1) - 1, at = place(sh.at.id), a = -Math.PI / 4 + n * 0.75; xy = [at[0] + 9 * Math.cos(a), at[1] + 9 * Math.sin(a)]; used.add(sh.at.id); }
    ships.push({ xy, route, desk: d.desk, held: !!(j && j.held_at), name: sh.name });
  }
  g.setLineDash([3, 4]);
  for (const s of ships) if (s.route) {
    g.strokeStyle = COL[s.desk] + "99"; g.beginPath(); g.moveTo(...s.route[0]); for (const p of s.route.slice(1)) g.lineTo(...p); g.stroke();
  }
  g.setLineDash([]);
  // Places: the bodies that orbit the Sun always, moons and stations where a ship is or is going. A label goes where it
  // overlaps no other label or ship (right, left, above, below), or is left out; the table names every place.
  g.font = "500 11px Inter, sans-serif"; g.textBaseline = "middle";
  const boxes = ships.map((s) => [s.xy[0] - 5, s.xy[1] - 5, 10, 10]), hit = (a) => boxes.some((b) => a[0] < b[0] + b[2] && b[0] < a[0] + a[2] && a[1] < b[1] + b[3] && b[1] < a[1] + a[3]);
  const shown = v.map.places.filter((p) => !far.has(p.id) && (p.parent === "sun" || used.has(p.id)));
  for (const p of shown) {
    const [x, y] = place(p.id), isBody = p.parent === "sun";
    g.fillStyle = isBody ? "#8796a6" : "#5d6c7c"; g.beginPath(); g.arc(x, y, isBody ? 3 : 2, 0, 2 * Math.PI); g.fill();
    boxes.push([x - 3, y - 3, 6, 6]);
  }
  const rank = (p) => (p.kind === "planet" ? 0 : used.has(p.id) ? 1 : 2); // planets first, then places in use
  for (const p of shown.sort((a, b) => rank(a) - rank(b))) {
    const [x, y] = place(p.id), w = g.measureText(p.name).width, at = [[x + 7, y - 7], [x - 7 - w, y - 7], [x - w / 2, y - 16], [x - w / 2, y + 12]]
      .map(([lx, ly]) => [lx, ly - 7, w, 14]).find((b) => !hit(b) && b[0] > 2 && b[0] + b[2] < W - 2 && b[1] > 2 && b[1] + b[3] < H - 2);
    if (!at) continue;
    boxes.push(at);
    g.fillStyle = used.has(p.id) ? "#c9d3dd" : "#7d8b99"; g.fillText(p.name, at[0], at[1] + 7);
  }
  for (const s of ships) {
    g.fillStyle = COL[s.desk]; g.strokeStyle = "#06090d"; g.lineWidth = 1.5;
    g.beginPath(); g.arc(s.xy[0], s.xy[1], 3.5, 0, 2 * Math.PI); g.fill(); g.stroke();
    if (s.held) { g.strokeStyle = COL[s.desk]; g.lineWidth = 1; g.beginPath(); g.arc(s.xy[0], s.xy[1], 7, 0, 2 * Math.PI); g.stroke(); }
  }
}

function render() {
  if (!view) return;
  const v = view, keep = document.querySelector(".comms")?.scrollTop || 0;
  app.replaceChildren(
    clockPanel(v),
    h("section", {},
      h("div", { class: "ph", style: "border:0;padding:0 0 10px" }, h("h2", {}, "Seats"),
        h("div", { class: "r" }, h("button", { class: "btn small", onclick: newCodes }, "New codes"))),
      h("div", { class: "grid" }, v.seats.map((s) => seatCard(v, s)))),
    h("div", { class: "two" }, mapPanel(v), scoresPanel(v)),
    h("div", { class: "two" }, jobsPanel(v), commsPanel(v)),
    desksPanel(v),
    h("p", { class: "foot" }, v.note, " Scores are points only. World ", v.world_id, "."));
  const c = document.querySelector(".comms");
  if (c) c.scrollTop = keep;
}

let resized = null;
addEventListener("resize", () => { clearTimeout(resized); resized = setTimeout(render, 150); });
if (!WORLD) startPage();
else {
  (async () => {
    if (!(await load())) return;
    let timer = setInterval(load, 3000);
    document.addEventListener("visibilitychange", () => {
      clearInterval(timer);
      if (!document.hidden) { load(); timer = setInterval(load, 3000); }
    });
  })();
}
</script>
</body>
</html>
